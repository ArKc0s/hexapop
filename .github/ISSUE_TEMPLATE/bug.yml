name: Signaler un bug
description: Quelque chose ne marche pas comme prévu
labels: ["bug"]
body:
  - type: textarea
    id: quoi
    attributes:
      label: Que s'est-il passé ?
      description: Ce que tu as vu, et ce que tu attendais à la place.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire ?
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. …
  - type: dropdown
    id: ecran
    attributes:
      label: Où ?
      options: [Accueil, Continuer (séance), Entraînement, Défi du jour, Entre amis (duel / équipe / soirée), Album, Hall of Fame, Compte et connexion, Autre]
  - type: input
    id: version
    attributes:
      label: Version d'Hexa
      description: Remplie toute seule si tu viens du lien « Signaler un bug » ; sinon, en bas de la page À propos.
      placeholder: ex. 1.8.0 · a3f9c21
  - type: input
    id: appareil
    attributes:
      label: Appareil et navigateur
      placeholder: ex. iPhone 15, Safari / PC, Firefox
  - type: textarea
    id: captures
    attributes:
      label: Capture d'écran
      description: Glisse une image ici si tu en as une.
