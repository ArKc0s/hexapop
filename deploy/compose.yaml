# Conteneur unique (API, WebSocket, client web). À placer derrière un proxy HTTPS (voir Caddyfile.hexapop).
services:
  hexapop:
    build: ./src
    image: hexapop:latest
    container_name: hexapop
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://hexapop.app
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
