# Copie de secours d'Hexa sur Cloudflare (voir README.md). Les fichiers viennent de la compilation du client web.
name = "hexapop-secours"
main = "worker.js"
compatibility_date = "2026-11-01"
routes = [{ pattern = "hexapop.app/*", zone_name = "hexapop.app" }]

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
run_worker_first = true
